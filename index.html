<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thời khóa biểu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2317233a'/%3E%3Cpath d='M8 11h16M8 16h16M8 21h10' stroke='%23f2c14e' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="crest" href="./">
      <span class="crest-mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="2.5"/><path d="M3 9h18M8 2.5v3M16 2.5v3M7.5 13h3M13.5 13h3M7.5 17h3"/></svg>
      </span>
      <span class="crest-text"><b id="school">Thời khóa biểu</b><span id="year"></span></span>
    </a>
    <nav class="nav" aria-label="Chọn trang">
      <a href="?xem=gv" data-tab="gv">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>Giáo viên</a>
      <a href="?xem=lop" data-tab="lop">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/></svg>Lớp học</a>
      <a href="?xem=quantri" data-tab="quantri">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Quản trị</a>
    </nav>
  </div>
</header>

<main>
  <!-- Xem thời khóa biểu -->
  <section id="view">
    <div class="head">
      <div>
        <p class="who-kind" id="kind">Thời khóa biểu</p>
        <h1 class="who-name" id="name">Đang tải…</h1>
        <div class="facts" id="facts"></div>
      </div>
      <div class="pickers">
        <div class="field">
          <label for="ngay">Ngày áp dụng</label>
          <select class="select" id="ngay"></select>
        </div>
        <div class="field">
          <label for="tim" id="timLabel">Giáo viên</label>
          <div class="combo" id="combo">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input class="input" id="tim" type="text" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="timList">
            <div class="combo-list" id="timList" role="listbox" hidden></div>
          </div>
        </div>
      </div>
    </div>

    <div id="out"></div>

    <div class="below" id="below" hidden>
      <div class="legend" id="legend"></div>
      <div class="actions">
        <button class="btn" id="copy" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
          <span>Sao chép link</span></button>
        <button class="btn" type="button" onclick="window.print()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></svg>
          In</button>
      </div>
    </div>
  </section>

  <!-- Quản trị -->
  <section id="admin" hidden></section>
</main>

<script src="assets/config.js"></script>
<script src="assets/parser.js"></script>
<script src="assets/render.js"></script>
<script src="assets/admin.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
